[project]
name = "cooloff"
version = "0.1.0"
description = "Family-steward agent with a rolling_risk_gate decision pattern for Strands Decider 2B"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "strands-agents>=1.0",
  "boto3>=1.35",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patterns", "agent", "demo"]
