# Pick one profile:
#   docker compose --profile cpu up -d --build
#   docker compose --profile gpu up -d --build
# The Decider server has no password and listens on localhost inside its container,
# so no port is published. Other containers share its network (network_mode: service:decider)
# and scripts run inside it with `docker compose exec decider ...`.

x-decider: &decider
  container_name: decider
  environment:
    DECIDER_MODEL: ${DECIDER_MODEL:-StrandsAgents/strands-decider-2B-qwen3.5-v1-2610}
  volumes:
    - decider-models:/models
    - ./results:/results
    - ./bench/data:/app/data:ro
  restart: "no"

services:
  decider-cpu:
    <<: *decider
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile.decider
      args:
        TORCH: cpu
    environment:
      DECIDER_MODEL: ${DECIDER_MODEL:-StrandsAgents/strands-decider-2B-qwen3.5-v1-2610}
      DECIDER_DEVICE: cpu

  decider-gpu:
    <<: *decider
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.decider
      args:
        TORCH: gpu
    environment:
      DECIDER_MODEL: ${DECIDER_MODEL:-StrandsAgents/strands-decider-2B-qwen3.5-v1-2610}
      DECIDER_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  decider-models:
